[build-system]
# >=77 is required for the PEP 639 `license`/`license-files` fields below.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revolut-x-python"
dynamic = ["version"]
description = "Python SDK for the Revolut X Crypto Exchange REST API (v1.0)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Jan Přikryl" },
]
keywords = ["revolut", "revolut-x", "crypto", "exchange", "trading", "api", "sdk", "bitcoin"]
dependencies = [
    "requests>=2.31.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "build>=1.0",
    # >=6.1 understands Metadata 2.4 (the PEP 639 `License-Expression` field),
    # older twine rejects the built artifacts with "unknown metadata version".
    "twine>=6.1",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-static-i18n>=1.2.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://janprikryl1.github.io/revolut-x-python/"
Documentation = "https://janprikryl1.github.io/revolut-x-python/"
Repository = "https://github.com/janprikryl1/revolut-x-python"
Changelog = "https://github.com/janprikryl1/revolut-x-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/janprikryl1/revolut-x-python/issues"

[tool.setuptools.dynamic]
# Single source of truth — bump src/revolut_x/_version.py only.
version = { attr = "revolut_x._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["revolut_x*"]

[tool.setuptools.package-data]
revolut_x = ["py.typed"]
